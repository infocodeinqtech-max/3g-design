name: Deploy 3G Deco Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install React dependencies
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Build React
      - name: Build React
        working-directory: frontend
        run: npm run build

      # Upload React build to Hostinger
      - name: Upload React Build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          source: "frontend/dist/*"
          target: "/home/u688571317/domains/codeinq.com/public_html/3gdeco/tmp_pro/"
          strip_components: 2